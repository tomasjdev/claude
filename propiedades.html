<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Explora nuestro catálogo completo de casas, departamentos y propiedades en venta o renta. Filtra por precio, ubicación y tipo de propiedad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav container">
    <a href="index.html" class="logo">Horizonte<span>Inmobiliaria</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="propiedades.html">Propiedades</a></li>
      <li><a href="nosotros.html">Nosotros</a></li>
      <li><a href="contacto.html">Contacto</a></li>
      <li class="nav-cta-mobile"><a href="contacto.html" class="btn btn-primary btn-sm btn-block">Agenda una cita</a></li>
    </ul>
    <div class="nav-actions">
      <a class="nav-phone" href="tel:+525512345678">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        +52 55 1234 5678
      </a>
      <a href="contacto.html" class="btn btn-primary btn-sm">Agenda una cita</a>
      <button class="nav-toggle" aria-label="Abrir menú"><span></span><span></span><span></span></button>
    </div>
  </nav>
</header>

<section class="page-banner">
  <div class="container">
    <h1>Nuestras propiedades</h1>
    <p class="breadcrumb"><a href="index.html">Inicio</a> / Propiedades</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="listing-layout">
      <aside class="filters">
        <h3>Filtrar resultados</h3>
        <form id="filter-form">
          <div class="filter-group">
            <label for="f-type">Operación</label>
            <select id="f-type">
              <option value="">Todas</option>
              <option value="venta">Venta</option>
              <option value="renta">Renta</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="f-category">Tipo de propiedad</label>
            <select id="f-category">
              <option value="">Todos</option>
              <option>Casa</option>
              <option>Departamento</option>
              <option>Casa de campo</option>
              <option>Loft</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="f-location">Ubicación</label>
            <input type="text" id="f-location" placeholder="Ej. Las Lomas">
          </div>
          <div class="filter-group">
            <label for="f-bedrooms">Recámaras mínimas</label>
            <select id="f-bedrooms">
              <option value="">Cualquiera</option>
              <option value="1">1+</option>
              <option value="2">2+</option>
              <option value="3">3+</option>
              <option value="4">4+</option>
              <option value="5">5+</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Precio</label>
            <div class="range-row">
              <input type="number" id="f-min-price" placeholder="Mín.">
              <input type="number" id="f-max-price" placeholder="Máx.">
            </div>
          </div>
          <button type="submit" class="btn btn-dark btn-block">Aplicar filtros</button>
          <button type="button" id="reset-filters" class="btn btn-outline btn-block" style="margin-top:10px; color:var(--color-primary); border-color:var(--color-border);">Limpiar filtros</button>
        </form>
      </aside>

      <div>
        <div class="listing-toolbar">
          <span class="results-count" id="results-count"></span>
          <select id="sort-select">
            <option value="relevance">Ordenar por relevancia</option>
            <option value="price-asc">Precio: menor a mayor</option>
            <option value="price-desc">Precio: mayor a menor</option>
            <option value="area-desc">Tamaño: mayor a menor</option>
          </select>
        </div>
        <div class="property-grid" id="property-results"></div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer" id="footer"></footer>

<script src="js/properties.js"></script>
<script src="js/main.js"></script>
<script src="js/footer.js"></script>
<script>
  const form = {
    type: document.getElementById("f-type"),
    category: document.getElementById("f-category"),
    location: document.getElementById("f-location"),
    bedrooms: document.getElementById("f-bedrooms"),
    minPrice: document.getElementById("f-min-price"),
    maxPrice: document.getElementById("f-max-price"),
  };
  const sortSelect = document.getElementById("sort-select");
  const resultsEl = document.getElementById("property-results");
  const countEl = document.getElementById("results-count");

  function applyUrlParams() {
    const params = new URLSearchParams(window.location.search);
    if (params.get("type")) form.type.value = params.get("type");
    if (params.get("category")) form.category.value = params.get("category");
    if (params.get("location")) form.location.value = params.get("location");
    if (params.get("maxPrice")) form.maxPrice.value = params.get("maxPrice");
  }

  function getFiltered() {
    let list = PROPERTIES.filter(p => {
      if (form.type.value && p.type !== form.type.value) return false;
      if (form.category.value && p.category !== form.category.value) return false;
      if (form.location.value && !p.location.toLowerCase().includes(form.location.value.toLowerCase())) return false;
      if (form.bedrooms.value && p.bedrooms < Number(form.bedrooms.value)) return false;
      if (form.minPrice.value && p.price < Number(form.minPrice.value)) return false;
      if (form.maxPrice.value && p.price > Number(form.maxPrice.value)) return false;
      return true;
    });

    switch (sortSelect.value) {
      case "price-asc": list.sort((a, b) => a.price - b.price); break;
      case "price-desc": list.sort((a, b) => b.price - a.price); break;
      case "area-desc": list.sort((a, b) => b.area - a.area); break;
    }
    return list;
  }

  function refresh() {
    const list = getFiltered();
    renderProperties(resultsEl, list);
    countEl.textContent = `${list.length} propiedad${list.length === 1 ? "" : "es"} encontrada${list.length === 1 ? "" : "s"}`;
  }

  document.getElementById("filter-form").addEventListener("submit", e => { e.preventDefault(); refresh(); });
  document.getElementById("reset-filters").addEventListener("click", () => {
    Object.values(form).forEach(f => f.value = "");
    sortSelect.value = "relevance";
    refresh();
  });
  sortSelect.addEventListener("change", refresh);

  applyUrlParams();
  refresh();
</script>
</body>
</html>
